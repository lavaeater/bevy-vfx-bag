[package]
name = "bevy-vfx-bag"
version = "0.2.0"
edition = "2021"
description = "An assorted bag of visual effects for Bevy"
categories = ["graphics", "game-development", "rendering"]
keywords = ["vfx", "graphics", "bevy", "gamedev", "wgsl"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/torsteingrindvik/bevy-vfx-bag"

exclude = [".github/", "scripts/"]

[features]

# No-ops, kept for compatibility: pipelines now follow each camera's target format.
default = ["sdr"]

hdr = []
sdr = []

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_log",
    "png",
    "tga",
] }

[dev-dependencies]
bevy = { version = "0.19.1", features = ["tga"] }
color-eyre = "0.6"
image = "0.25.10"
once_cell = "1"
